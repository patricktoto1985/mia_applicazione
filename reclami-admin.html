<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRCC · Gestione Reclami</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090d15;color:#f3f5fa;font:15px system-ui,Arial,sans-serif}header{background:#121a29;border-bottom:2px solid #e10600;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0}a{color:#40dfdc}main{max-width:1120px;margin:30px auto;padding:0 18px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}button,select{background:#1b273b;color:white;border:1px solid #40536e;border-radius:8px;padding:11px;cursor:pointer}button{background:#e10600;border:0;font-weight:700}.item{background:#141c2b;border:1px solid #29364c;border-radius:14px;padding:20px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{background:#352819;color:#ffd08a;padding:5px 10px;border-radius:15px;font-size:12px}.desc{white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}.meta{color:#a7b5c8;font-size:13px}.video{display:inline-block;margin-top:12px}.error{color:#ff9696}.empty{color:#a7b5c8}.item h2{font-size:17px;margin:12px 0}#status{margin:10px 0 20px}</style></head><body>
<header><h1>⚖️ GRCC F1 ESPORTS · Gestione Reclami</h1><a href="index.html">← Race Control</a></header>
<main><div class="toolbar"><label for="round">Gran Premio</label><select id="round"><option value="">Tutti i round</option></select><button id="reload">↻ Aggiorna</button></div><div id="status" role="status"></div><div id="results"></div></main>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbz30o3f7QkmijHWpQgwInJMIcIujmO_F070OwXhqbKnQidHdJC4iLa-rQZy0WzsN9buuA/exec';
const isAdmin=sessionStorage.getItem('grcc_admin')==='true';
const token=sessionStorage.getItem('grcc_admin_token')||'';
const results=document.getElementById('results'), status=document.getElementById('status');
const select=document.getElementById('round');
for(let i=1;i<=24;i++){const o=document.createElement('option');o.value=String(i);o.textContent='Round '+i;select.appendChild(o)}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=String(txt);return e}
let all=[];
function render(){results.replaceChildren();const chosen=select.value;const rows=all.filter(r=>!chosen||String(r.round)===chosen);if(!rows.length){results.appendChild(el('p','empty','Nessun reclamo trovato.'));return}for(const r of rows){const card=el('article','item');const top=el('div','top');top.append(el('strong','',`Round ${r.round||'—'} · ${r.segnalante||'Pilota sconosciuto'} → ${r.segnalato||'—'}`),el('span','tag',r.stato||'DA ESAMINARE'));card.append(top,el('p','meta',r.dataOra||''),el('h2','','Descrizione del reclamo'),el('p','desc',r.descrizione||'Nessuna descrizione'));if(r.video){try{const url=new URL(String(r.video));if(url.protocol==='https:'||url.protocol==='http:'){const a=el('a','video','▶ Apri video allegato');a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';card.append(a)}}catch(e){}}results.append(card)}}
async function load(){if(!isAdmin||!token){status.className='error';status.textContent='Accesso riservato agli amministratori: effettua il login da Race Control.';return}status.className='';status.textContent='Caricamento reclami…';results.replaceChildren();try{const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'complaint_admin_list',adminToken:token})});const data=await res.json();if(!data.success)throw Error(data.message||'Risposta non valida');all=Array.isArray(data.reclami)?data.reclami:[];status.textContent=`${all.length} reclami totali`;render()}catch(err){status.className='error';status.textContent='Impossibile caricare i reclami: '+err.message}}
select.addEventListener('change',render);document.getElementById('reload').addEventListener('click',load);load();
</script></body></html>
