<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRCC · Gestione Reclami</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090d15;color:#f3f5fa;font:15px system-ui,Arial,sans-serif}header{background:#121a29;border-bottom:2px solid #e10600;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0}a{color:#40dfdc}main{max-width:1120px;margin:30px auto;padding:0 18px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}button,select{background:#1b273b;color:white;border:1px solid #40536e;border-radius:8px;padding:11px;cursor:pointer}button{background:#e10600;border:0;font-weight:700}.item{background:#141c2b;border:1px solid #29364c;border-radius:14px;padding:20px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{background:#352819;color:#ffd08a;padding:5px 10px;border-radius:15px;font-size:12px}.desc{white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}.meta{color:#a7b5c8;font-size:13px}.video{display:inline-block;margin-top:12px}.error{color:#ff9696}.empty{color:#a7b5c8}.item h2{font-size:17px;margin:12px 0}#status{margin:10px 0 20px}textarea,input{background:#0b1220;color:#fff;border:1px solid #40536e;border-radius:8px;padding:11px;width:100%;font:inherit} .decision{margin-top:18px;padding:16px;background:#0b1220;border:1px solid #35455f;border-radius:12px}.decision label{display:block;margin:10px 0 5px;color:#a7b5c8}.decision select{width:100%}.decision button{margin-top:12px;margin-right:8px}.decision button.secondary{background:#26384f}.saved{color:#6de3a6}.reply{margin-top:14px;padding:12px;border-left:3px solid #40dfdc;background:#0b1220} .verdict{border-left:4px solid #e6ad3d;padding:12px;background:#1b2231;margin-top:12px} </style></head><body>
<header><h1>⚖️ GRCC F1 ESPORTS · Gestione Reclami</h1><a href="index.html">← Race Control</a></header>
<main><div class="toolbar"><label for="round">Gran Premio</label><select id="round"><option value="">Tutti i Gran Premi</option></select><button id="reload">↻ Aggiorna</button></div><div id="status" role="status"></div><div id="results"></div></main>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbz30o3f7QkmijHWpQgwInJMIcIujmO_F070OwXhqbKnQidHdJC4iLa-rQZy0WzsN9buuA/exec';
const isAdmin=sessionStorage.getItem('grcc_admin')==='true';
const token=sessionStorage.getItem('grcc_admin_token')||'';
const results=document.getElementById('results'), status=document.getElementById('status');
const select=document.getElementById('round');
const GRCC_GP=['Australia','Cina','Giappone','Bahrain','Arabia Saudita','Miami','Canada','Monaco','Barcellona','Austria','Gran Bretagna','Belgio','Ungheria','Olanda','Italia','Spagna','Azerbaijan','Singapore','Stati Uniti','Messico','San Paolo','Las Vegas','Qatar','Abu Dhabi'];
function nomeGP(round){const n=Number(String(round??'').replace(/^R/i,''));return Number.isInteger(n)&&n>=1&&n<=GRCC_GP.length?'GP '+GRCC_GP[n-1]:'Round '+(round||'—')}
for(let i=1;i<=24;i++){const o=document.createElement('option');o.value=String(i);o.textContent=nomeGP(i);select.appendChild(o)}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=String(txt);return e}
let all=[];
function render(){
 results.replaceChildren();const chosen=select.value;const rows=all.filter(r=>!chosen||String(r.round).replace(/^R/i,'')===chosen);
 if(!rows.length){results.appendChild(el('p','empty','Nessun reclamo trovato.'));return}
 for(const r of rows){
  const card=el('article','item'),top=el('div','top');
  top.append(el('strong','',`${nomeGP(r.round)} · ${r.segnalante||'—'} → ${r.segnalato||'—'}`),el('span','tag',r.stato||'DA ESAMINARE'));
  card.append(top,el('p','meta',r.dataOra||''),el('h2','','Descrizione del reclamo'),el('p','desc',r.descrizione||'Nessuna descrizione'));
  function addLink(url,label){if(!url)return;try{const u=new URL(String(url));if(['https:','http:'].includes(u.protocol)){card.append(grccVideoButton(u.href,label))}}catch(e){}}
  addLink(r.video,'▶ Apri video allegato');
  if(r.risposta){const reply=el('div','reply');reply.append(el('strong','','Difesa del pilota'),el('p','desc',r.risposta));card.append(reply)}
  addLink(r.videoRisposta,'▶ Video controreclamo');
  if(r.pubblicato){const box=el('div','verdict');box.append(el('strong','',`DECISIONE UFFICIALE: ${r.esito}`),el('p','',r.penalita?`Penalità: ${r.penalita}`:''),el('p','desc',r.motivazione||''),el('p','meta',`Pubblicata il ${r.dataDecisione||'—'}`));card.append(box)}
  else{
   const box=el('div','decision');box.append(el('h2','','⚖️ Valutazione Direzione Gara'));
   const esito=el('select');for(const v of ['IN VALUTAZIONE','PENALITÀ ASSEGNATA','NESSUNA PENALITÀ','RECLAMO RESPINTO','ARCHIVIATO']){const o=el('option','',v);o.value=v;esito.append(o)}esito.value=r.esito||'IN VALUTAZIONE';
   const penalty=el('select');for(const v of ['','AVVERTIMENTO','WARNING','5 SECONDI','10 SECONDI','30 SECONDI','PUNTI PATENTE','PENALITÀ IN GRIGLIA','SQUALIFICA','ALTRA PENALITÀ']){const o=el('option','',v||'Seleziona penalità');o.value=v;penalty.append(o)}penalty.value=r.penalita||'';
   const note=el('textarea');note.rows=4;note.maxLength=5000;note.placeholder='Spiega la decisione, dinamica, responsabilità e motivazione...';note.value=r.motivazione||'';
   box.append(el('label','','Esito'),esito,el('label','','Penalità (se applicabile)'),penalty,el('label','','Motivazione della Direzione Gara'),note);
   const msg=el('p','meta','');
   async function save(publish){if(publish&&!confirm('Pubblicare il verdetto definitivo? Il reclamo sarà chiuso e la decisione non sarà più modificabile.'))return;
    msg.textContent='Salvataggio in corso…';try{const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'complaint_admin_decision',adminToken:token,id:r.id,esito:esito.value,penalita:penalty.value,motivazione:note.value,pubblicato:publish})});const data=await res.json();if(!data.success)throw Error(data.message||'Errore');msg.className='saved';msg.textContent=data.message;if(publish)await load()}catch(e){msg.className='error';msg.textContent=e.message}}
   const draft=el('button','secondary','Salva bozza'),pub=el('button','','Pubblica decisione ufficiale');draft.type=pub.type='button';draft.onclick=()=>save(false);pub.onclick=()=>save(true);
   box.append(draft,pub,msg);card.append(box)
  }
  results.append(card)
 }
}
async function load(){if(!isAdmin||!token){status.className='error';status.textContent='Accesso riservato agli amministratori: effettua il login da Race Control.';return}status.className='';status.textContent='Caricamento reclami…';results.replaceChildren();try{const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'complaint_admin_list',adminToken:token})});const data=await res.json();if(!data.success)throw Error(data.message||'Risposta non valida');all=Array.isArray(data.reclami)?data.reclami:[];status.textContent=`${all.length} reclami totali`;render()}catch(err){status.className='error';status.textContent='Impossibile caricare i reclami: '+err.message}}
select.addEventListener('change',render);document.getElementById('reload').addEventListener('click',load);load();
</script><style>
.grcc-video-open{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:9px 13px;border:1px solid #00cdb9;border-radius:8px;background:#12333a;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.grcc-video-open:hover{background:#19505a}
/* Lettore responsive: area visibile anche con barre browser mobile */
.grcc-video-modal[hidden]{display:none!important}
.grcc-video-modal{position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:12px;overscroll-behavior:contain}
.grcc-video-panel{background:#111b29;border:1px solid #3b5068;border-radius:14px;width:min(1050px,100%);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;padding:14px;display:flex;flex-direction:column;gap:10px}
.grcc-video-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;flex:none}.grcc-video-bar strong{color:#fff}.grcc-video-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grcc-video-actions a{color:#60e7dc}.grcc-video-close,.grcc-video-fullscreen{background:#e10600;color:white;border:0;border-radius:8px;padding:10px 13px;cursor:pointer;font:inherit;font-weight:700}.grcc-video-fullscreen{background:#263c58}
.grcc-video-stage{position:relative;width:100%;aspect-ratio:16/9;min-height:0;flex:none;background:#000;border-radius:8px;overflow:hidden}
.grcc-video-frame{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#000}
.grcc-video-note{font-size:12px;color:#a7b5c8;margin:0;line-height:1.4;flex:none}
.grcc-video-stage:fullscreen,.grcc-video-stage:-webkit-full-screen{width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;background:#000}
.grcc-video-stage:fullscreen .grcc-video-frame,.grcc-video-stage:-webkit-full-screen .grcc-video-frame{width:100%;height:100%}
@media(max-width:650px){
 .grcc-video-modal{padding:8px;align-items:center}
 .grcc-video-panel{width:100%;max-height:calc(100dvh - 16px);padding:10px;border-radius:12px;gap:10px}
 .grcc-video-bar{gap:8px}.grcc-video-bar strong{font-size:15px}
 .grcc-video-actions{width:100%;justify-content:space-between;gap:6px}
 .grcc-video-actions a{font-size:13px}
 .grcc-video-close,.grcc-video-fullscreen{font-size:13px;padding:10px 9px}
 .grcc-video-stage{aspect-ratio:16/9}
 .grcc-video-note{font-size:11px}
}
@media(max-width:650px) and (orientation:landscape){
 .grcc-video-panel{max-height:calc(100dvh - 12px);padding:8px}
 .grcc-video-bar{flex-wrap:nowrap}.grcc-video-actions{width:auto}
 .grcc-video-note{display:none}
 .grcc-video-stage{aspect-ratio:auto;height:calc(100dvh - 90px);min-height:100px}
}
</style>
<div id="grccVideoModal" class="grcc-video-modal" role="dialog" aria-modal="true" aria-label="Riproduzione video" hidden>
 <div class="grcc-video-panel">
  <div class="grcc-video-bar"><strong>🎬 Video del reclamo</strong><div class="grcc-video-actions"><a id="grccVideoExternal" href="#" target="_blank" rel="noopener noreferrer">Apri originale ↗</a><button type="button" class="grcc-video-fullscreen" id="grccVideoFullscreen">⛶ Schermo intero</button><button type="button" class="grcc-video-close" id="grccVideoClose">✕ Chiudi</button></div></div>
  <div class="grcc-video-stage" id="grccVideoStage"><iframe id="grccVideoFrame" class="grcc-video-frame" title="Video del reclamo" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <p class="grcc-video-note">Per i video Google Drive la riproduzione avviene nel lettore Drive incorporato. Alcuni servizi esterni possono richiedere l'apertura del link originale.</p>
 </div>
</div>
<script>
(function(){
 const modal=document.getElementById('grccVideoModal'),frame=document.getElementById('grccVideoFrame'),external=document.getElementById('grccVideoExternal'),close=document.getElementById('grccVideoClose'),stage=document.getElementById('grccVideoStage'),full=document.getElementById('grccVideoFullscreen');
 let previousFocus=null,previousOverflow='';
 function playerUrl(raw){
  let u;try{u=new URL(raw)}catch{return null}
  if(u.protocol!=='https:')return null;
  const host=u.hostname.toLowerCase();let m;
  if(host==='drive.google.com'){
   m=u.pathname.match(/^\/file\/d\/([a-zA-Z0-9_-]+)/);
   const id=m?.[1]||(u.pathname==='/open'||u.pathname==='/uc'?u.searchParams.get('id'):null);
   if(id&&/^[a-zA-Z0-9_-]+$/.test(id))return 'https://drive.google.com/file/d/'+id+'/preview';
  }
  if(host==='youtu.be'){const id=u.pathname.slice(1);if(/^[a-zA-Z0-9_-]{11}$/.test(id))return 'https://www.youtube-nocookie.com/embed/'+id}
  if(host==='youtube.com'||host==='www.youtube.com'||host==='m.youtube.com'){
   const id=u.pathname.startsWith('/shorts/')?u.pathname.split('/')[2]:u.searchParams.get('v');if(id&&/^[a-zA-Z0-9_-]{11}$/.test(id))return 'https://www.youtube-nocookie.com/embed/'+id;
  }
  return null;
 }
 function openVideo(raw){let u;try{u=new URL(raw)}catch{return}if(!['https:','http:'].includes(u.protocol))return;
  const embed=playerUrl(u.href);if(!embed){window.open(u.href,'_blank','noopener,noreferrer');return}
  previousFocus=document.activeElement;external.href=u.href;frame.src=embed;modal.hidden=false;previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';close.focus();
 }
 function closeVideo(){if(document.fullscreenElement===stage)document.exitFullscreen?.().catch(()=>{});frame.removeAttribute('src');modal.hidden=true;document.body.style.overflow=previousOverflow;previousFocus?.focus?.()}
 document.addEventListener('click',e=>{const b=e.target.closest?.('[data-grcc-video]');if(b){e.preventDefault();openVideo(b.dataset.grccVideo)}});
 full.addEventListener('click',async()=>{try{if(document.fullscreenElement===stage){await document.exitFullscreen();return}if(stage.requestFullscreen){await stage.requestFullscreen();return}if(stage.webkitRequestFullscreen){stage.webkitRequestFullscreen();return}alert('Schermo intero non disponibile in questo browser. Prova Apri originale o ruota il telefono.')}catch(e){alert('Il browser non consente lo schermo intero per questo video. Prova Apri originale.')}});close.addEventListener('click',closeVideo);modal.addEventListener('click',e=>{if(e.target===modal)closeVideo()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeVideo()});
 window.grccVideoButton=function(url,label){const b=document.createElement('button');b.type='button';b.className='grcc-video-open';b.dataset.grccVideo=String(url);b.textContent=label||'🎬 Guarda video';return b};
})();
</script>
</body></html>
