<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regolamento Campionato | GRCCF1ESPORT</title>
    
    <script>
        if (sessionStorage.getItem('grcc_authenticated') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <style>
        :root {
            --f1-red: #e10600;
            --dark-bg: #0b0f19;
            --card-bg: #131a26;
            --accent-cyan: #00ffd1;
            --text-light: #ffffff;
            --text-muted: #8fa0b5;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
        }
        .container { max-width: 900px; margin: 10px auto; }
        
        .back-btn {
            display: inline-block;
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid var(--accent-cyan);
            padding: 8px 16px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .back-btn:hover { background-color: var(--accent-cyan); color: #000; }
        
        .card { background-color: var(--card-bg); padding: 25px; border-radius: 16px; border: 1px solid #1f2c3f; margin-bottom: 25px; }
        h2 { color: var(--f1-red); margin-top: 0; text-transform: uppercase; border-bottom: 1px solid #1f2c3f; padding-bottom: 10px; }
        
        .pdf-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #0b0f19;
            border: 2px dashed #1f2c3f;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--f1-red);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            font-weight: bold;
            border-radius: 8px;
            text-transform: uppercase;
            font-size: 1rem;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(225, 6, 0, 0.3);
            border: none;
            cursor: pointer;
        }
        .btn-download:hover { background-color: #b80500; transform: translateY(-2px); }

        /* BOX CARICAMENTO DIREZIONE GARA */
        .admin-upload-box {
            background: rgba(0, 255, 209, 0.05);
            border: 1px solid var(--accent-cyan);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none; /* Gestito da JS */
        }
        .admin-upload-box h3 { color: var(--accent-cyan); margin-top: 0; text-transform: uppercase; font-size: 1.1rem; }
        
        .file-input-wrapper {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        input[type="file"] {
            background: #0b0f19;
            padding: 10px;
            border: 1px solid #1f2c3f;
            border-radius: 6px;
            color: #fff;
            flex-grow: 1;
        }
        .btn-save-pdf {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-save-pdf:hover { background: #00ccaa; }

        .preview-frame {
            width: 100%;
            height: 600px;
            border: 1px solid #1f2c3f;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .preview-frame {
                display: none !important;
            }

            .pdf-container {
                padding-bottom: 30px;
            }

            .btn-download {
                width: 100%;
                max-width: 420px;
                justify-content: center;
                box-sizing: border-box;
            }
        }


    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn">⬅ Torna al Race Control</a>


        </div>




        <div class="card">
            <h2>Regolamento Ufficiale GRCC</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem;">
                Consulta il regolamento sportivo e tecnico del campionato. Ogni pilota è tenuto a conoscere le norme comportamentali in pista e fuori pista.
            </p>

            <div class="pdf-container" id="noPdfMessage">
                <span style="font-size: 3rem; margin-bottom: 15px;">📄</span>
                <h3 style="margin: 0 0 10px 0; color: #fff;">Visualizza il Regolamento</h3>
                <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;" id="pdfStatusText">Nessun file caricato al momento.</p>
                <a id="downloadLink" href="#" target="_blank" rel="noopener noreferrer" class="btn-download" style="display: none;" download>
                    Apri / Scarica Regolamento PDF
                </a>
            </div>

            <iframe id="pdfPreview" class="preview-frame" src=""></iframe>
        </div>
    </div>

    <script>
        window.addEventListener('load', checkRegolamentoEsistente);

        function checkRegolamentoEsistente() {
            // Il PDF ufficiale e' pubblicato nel repository, non nel browser locale.
            const pdfUrl = 'regolamento.pdf';
            const statusText = document.getElementById('pdfStatusText');
            const downloadLink = document.getElementById('downloadLink');
            const pdfPreview = document.getElementById('pdfPreview');
            statusText.innerText = 'Clicca sotto per aprire il regolamento ufficiale aggiornato.';
            downloadLink.href = pdfUrl;
            downloadLink.setAttribute('download', 'regolamento.pdf');
            downloadLink.style.display = 'inline-flex';
            pdfPreview.src = pdfUrl;
            pdfPreview.style.display = window.innerWidth > 768 ? 'block' : 'none';
        }

    </script>

<!-- GRCC: pulsante torna su, tutte le pagine -->
<style id="grcc-back-to-top-style">
#grcc-back-to-top{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));z-index:2147483000;width:52px;height:52px;border:2px solid rgba(255,255,255,.32);border-radius:50%;background:#e10600;color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.4);font:800 27px/1 system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(12px);pointer-events:none;transition:opacity .2s ease,transform .2s ease,visibility .2s ease}
#grcc-back-to-top.grcc-visible{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
#grcc-back-to-top:hover{background:#b90500}
#grcc-back-to-top:focus-visible{outline:3px solid #00ffd1;outline-offset:3px}
@media(max-width:640px){#grcc-back-to-top{width:46px;height:46px;right:15px;bottom:calc(18px + env(safe-area-inset-bottom));font-size:25px}}
@media(prefers-reduced-motion:reduce){#grcc-back-to-top{transition:none}}
</style>
<script id="grcc-back-to-top-script">
(function(){
  function init(){
    if(document.getElementById('grcc-back-to-top'))return;
    var button=document.createElement('button');
    button.type='button';button.id='grcc-back-to-top';button.textContent='↑';
    button.setAttribute('aria-label','Torna in cima alla pagina');button.title='Torna su';
    document.body.appendChild(button);
    function update(){
      var y=Math.max(window.scrollY||0,document.documentElement.scrollTop||0,document.body.scrollTop||0);
      button.classList.toggle('grcc-visible',y>250);
    }
    button.addEventListener('click',function(){
      var smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({top:0,behavior:smooth?'smooth':'auto'});
      document.documentElement.scrollTo({top:0,behavior:smooth?'smooth':'auto'});
    });
    window.addEventListener('scroll',update,{passive:true});
    window.addEventListener('resize',update,{passive:true});
    update();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

</body>
</html>
