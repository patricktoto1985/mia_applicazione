<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica Piloti | GRCCF1ESPORT</title>
    <style>
        :root {
            --f1-red: #e10600;
            --dark-bg: #0b0f19;
            --card-bg: #131a26;
            --accent-cyan: #00ffd1;
            --text-light: #ffffff;
            --text-muted: #8fa0b5;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
        }
        .container { max-width: 900px; margin: 10px auto; }
        .back-btn {
            display: inline-block;
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid var(--accent-cyan);
            padding: 8px 16px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .back-btn:hover { background-color: var(--accent-cyan); color: #000; }
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid #1f2c3f; }
        h2 { color: var(--f1-red); margin-top: 0; text-transform: uppercase; border-bottom: 1px solid #1f2c3f; padding-bottom: 10px; margin-bottom: 5px; }
        .status-text { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Contenitore per rendere la tabella fluida sui telefoni */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 500px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #1f2c3f; }
        th { color: var(--accent-cyan); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        tr:hover { background-color: rgba(255,255,255,0.01); }
        
        .race-num { font-family: monospace; font-weight: bold; color: var(--text-muted); font-size: 1rem; width: 50px; }
        .pilot-name { font-size: 0.95rem; }
        
        /* Forza la scuderia a stare su una riga sola */
        .team-cell { white-space: nowrap; }
        .team { font-weight: 600; padding-left: 8px; font-size: 0.9rem; }
        
        .ferrari { border-left: 4px solid #e10600; }
        .audi { border-left: 4px solid #f5f5f5; }
        .cadillac { border-left: 4px solid #555555; }
        .mclaren { border-left: 4px solid #ff8700; }
        .mercedes { border-left: 4px solid #00a19c; }
        .redbull { border-left: 4px solid #0c1e43; }
        .aston { border-left: 4px solid #006643; }
        .alpine { border-left: 4px solid #0078c1; }
        .williams { border-left: 4px solid #005aff; }
        .haas { border-left: 4px solid #e60000; }
        .rb { border-left: 4px solid #6699ff; }
        
        .punti { font-weight: bold; color: var(--text-muted); font-size: 1rem; text-align: center; }
        .th-punti { text-align: center; }

        /* Ottimizzazioni specifiche per schermi molto piccoli */
        @media (max-width: 480px) {
            th, td { padding: 10px 6px; }
            .team { font-size: 0.85rem; }
            .pilot-name { font-size: 0.85rem; }
        }
    
/* GRCC: visualizzazione integrale delle classifiche su smartphone */
@media (max-width: 640px) {
  html, body { max-width:100%; overflow-x:hidden; }
  body { padding:12px; }
  .container { width:100%; max-width:100%; margin:8px auto; min-width:0; }
  .card { padding:15px 12px; min-width:0; }
  h2 { font-size:clamp(1.25rem,5.5vw,1.65rem); line-height:1.2; overflow-wrap:anywhere; }
  .status-text { font-size:.74rem; line-height:1.5; letter-spacing:.3px; overflow-wrap:anywhere; }
  .table-responsive { overflow:visible; width:100%; }
  table, tbody { display:block; width:100%; min-width:0; margin:0; }
  thead { display:none; }
  tbody tr { display:grid; width:100%; min-width:0; grid-template-columns:minmax(0,1fr) auto; gap:9px 10px; align-items:center; background:#0d1522; border:1px solid #2b3b50; border-radius:13px; margin:11px 0; padding:14px 12px; }
  tbody td { display:block; min-width:0; padding:0; border:0; overflow-wrap:anywhere; }
  tbody tr td[colspan] { grid-column:1/-1; text-align:center; }
  .punti { text-align:right; color:#00ffd1; font-size:1.3rem; font-weight:900; }
  .punti::before { content:'PUNTI'; display:block; color:#9eafc3; font-size:.65rem; font-weight:700; letter-spacing:1px; margin-bottom:3px; }
}
@media (max-width:640px) {
   tbody tr { grid-template-columns:42px minmax(0,1fr) auto; }
   .race-num { grid-column:1; grid-row:1/3; width:auto; align-self:center; font-size:1.2rem; color:#00ffd1; }
   .race-num::before { content:'#'; font-size:.85rem; }
   .pilot-name { grid-column:2; grid-row:1; font-weight:900; font-size:1rem; }
   .team-cell { grid-column:2; grid-row:2; white-space:normal; color:#a9bad0; font-size:.84rem; }
   .punti { grid-column:3; grid-row:1/3; }
  }

/* GRCC: correzione centratura e larghezza effettiva su mobile */
*, *::before, *::after { box-sizing: border-box; }
@media (max-width:640px) {
  html,body { width:100%; max-width:100%; overflow-x:clip; }
  body { margin:0; padding:12px; }
  .container { width:100%; max-width:100%; margin:8px auto; }
  .card { width:100%; max-width:100%; padding:15px 12px; overflow:hidden; }
  .table-responsive, table, tbody { width:100%; max-width:100%; min-width:0; }
  tbody tr { box-sizing:border-box; width:100%; max-width:100%; margin:11px 0; }
  tbody td { min-width:0; }
  .back-btn { max-width:100%; }
}
</style>
<style id="grcc-fanta-promo-style">
#grcc-fanta-promo{position:sticky;top:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:9px 42px 9px 14px;background:linear-gradient(110deg,#250509,#ae1025 48%,#250509);color:white;text-align:center;font:700 13px/1.35 system-ui,Arial,sans-serif;border-bottom:2px solid #ffcf45;box-shadow:0 3px 18px #0008;animation:grccFantaGlow 2.5s ease-in-out infinite}
#grcc-fanta-promo a{display:inline-block;background:#ffce31;color:#1a1010;padding:7px 13px;border-radius:7px;text-decoration:none;font-weight:900;white-space:nowrap}
#grcc-fanta-promo a:hover{background:white}
#grcc-fanta-promo button{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:#ffffff25;color:white;font-size:20px;border-radius:5px;width:28px;height:28px;cursor:pointer}
@keyframes grccFantaGlow{0%,100%{box-shadow:0 3px 12px #0007;border-bottom-color:#ffcf45}50%{box-shadow:0 4px 18px #ff294477;border-bottom-color:white}}
@media(max-width:600px){#grcc-fanta-promo{font-size:11px;gap:5px;padding:7px 37px 7px 8px}#grcc-fanta-promo a{padding:5px 8px}}
@media(prefers-reduced-motion:reduce){#grcc-fanta-promo{animation:none}}
</style>

<body>
<div id="grcc-fanta-promo" role="region" aria-label="Promemoria Fanta GRCC"><span>🏎️ FANTA GRCC — Hai già fatto i tuoi pronostici? 🏆</span><a href="https://fanta-grcc.vercel.app/" target="_blank" rel="noopener noreferrer">GIOCA ORA →</a><button type="button" aria-label="Chiudi promemoria Fanta GRCC" onclick="this.parentElement.remove()">×</button></div>

    <div class="container">
        <a href="index.html" class="back-btn">⬅ Torna al Race Control</a>

        <div class="card">
            <h2>Classifica Assoluta Piloti</h2>
            <div class="status-text">GRCCF1ESPORTS — Stagione 2026/27 — Caricamento in corso</div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Num</th>
                            <th>Pilota</th>
                            <th>Scuderia</th>
                            <th class="th-punti">Punti</th>
                        </tr>
                    </thead>
                    <tbody id="piloti-table-body">
                        <tr id="piloti-loading"><td colspan="4" style="text-align:center;">Caricamento classifica...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>

const SCRIPT_URL='https://script.google.com/macros/s/AKfycbz30o3f7QkmijHWpQgwInJMIcIujmO_F070OwXhqbKnQidHdJC4iLa-rQZy0WzsN9buuA/exec';
const DRIVERS=[
{"name":"SICKMIRKO","team":"Ferrari"},{"name":"MIKYPOWER","team":"Ferrari"},
{"name":"SALVOTD91","team":"Mercedes"},{"name":"MKI-110","team":"Mercedes"},
{"name":"RAO-783","team":"Red Bull"},{"name":"BENE20DOMENICO","team":"Red Bull"},
{"name":"LRT_KURAMA","team":"McLaren"},{"name":"FRA319153","team":"McLaren"},
{"name":"DAGGER74SUN","team":"Aston Martin"},{"name":"GIUMEND29","team":"Aston Martin"},
{"name":"CECCO67_SCAI","team":"Audi"},{"name":"DANIELE251191","team":"Audi"},
{"name":"NXS_ODI","team":"Cadillac"},{"name":"KEIDIKID2","team":"Cadillac"},
{"name":"GRCC F1 VITTORIO","team":"Racing Bulls"},{"name":"LILLUPAZZU","team":"Racing Bulls"},
{"name":"CONDE785","team":"Alpine"},{"name":"PEPPEFLE_IRT","team":"Alpine"},
{"name":"ICEANT16","team":"Williams"},{"name":"TICXY13","team":"Williams"},
{"name":"DAVIARCO1999","team":"Haas"},{"name":"BRA_FOSY89","team":"Haas"}
];
const teams=["Ferrari","Mercedes","Red Bull","McLaren","Aston Martin","Audi","Cadillac","Racing Bulls","Alpine","Williams","Haas"];
const aliases={"CECCO":"CECCO67_SCAI","GRCCMENDOLIA29":"GIUMEND29","MIKYPOW3R_25":"MIKYPOWER","GRCC VITTORIO_F1_":"GRCC F1 VITTORIO"};
const roster=new Map(DRIVERS.map(d=>[d.name.toUpperCase(),d]));
async function roundData(round){
 const response=await fetch(`${SCRIPT_URL}?action=results_round&round=${round}&_=${Date.now()}`,{cache:'no-store'});
 if(!response.ok)throw Error('HTTP '+response.status);
 const data=await response.json();
 if(data.success===false)throw Error(data.message||'Risposta server negativa');
 return Array.isArray(data.risultati)?data.risultati:[];
}
function td(tr,text,cls){const el=document.createElement('td');el.textContent=text;if(cls)el.className=cls;tr.appendChild(el)}
const GRCC_CACHE_KEY='grcc_classifica_piloti_v4_sprint_live';
const GRCC_EXCLUDED_DRIVERS=new Set(['TICXY13','MKI-110']);
const GRCC_CACHE_MS=0; // Aggiorna sempre all'apertura; cache solo come ripiego
function grccDisegnaClassifica(rows, count, failed=0, cached=false){
 const body=document.querySelector('tbody'),status=document.querySelector('.status-text');
 body.replaceChildren();
 rows.filter(entry=>!GRCC_EXCLUDED_DRIVERS.has(String(entry.name||'').trim().toUpperCase())).forEach((entry,i)=>{const tr=document.createElement('tr');td(tr,i+1,'race-num');td(tr,entry.name,'pilot-name');td(tr,entry.team,'team-cell');td(tr,entry.points,'punti');body.appendChild(tr)});
 status.textContent=`GRCCF1ESPORTS — 2026/27 — ${count} GP pubblicati${failed?' · '+failed+' richieste non riuscite':''}${cached?' · dati salvati':''}`;
}
function grccLeggiCache(){try{const v=JSON.parse(localStorage.getItem(GRCC_CACHE_KEY)||'null');return v&&Array.isArray(v.rows)&&Number.isFinite(v.time)?v:null;}catch(e){return null;}}
function grccSalvaCache(rows,count){try{localStorage.setItem(GRCC_CACHE_KEY,JSON.stringify({rows,count,time:Date.now()}));}catch(e){}}

async function load(){
 const cached=grccLeggiCache();
 if(cached){grccDisegnaClassifica(cached.rows,cached.count,0,true);} // Mostra cache, ma aggiorna sempre
 const body=document.querySelector('tbody'),status=document.querySelector('.status-text');
 status.textContent='Caricamento risultati da Google Sheets...';
 const totals=new Map();let count=0,failed=0,sprintCount=0,sprintFailed=0;
 for(let start=1;start<=24;start+=6){
  const all=await Promise.allSettled(Array.from({length:Math.min(6,25-start)},(_,i)=>roundData(start+i)));
  for(let i=0;i<all.length;i++){
    const response=all[i];
    const currentRound=start+i;
   if(response.status==='rejected'){failed++;continue;}
   const rows=response.value;if(rows.length)count++;
   for(const row of rows){
    const raw=String(row.pilota||'').trim();if(!raw)continue;
    const name=aliases[raw.toUpperCase()]||raw;
    const info=roster.get(name.toUpperCase());
    const team=info?.team||String(row.team||'').trim();
    const state=String(row.stato||'CLASSIFICATO').toUpperCase();
    // Squalifica ufficiale TICXY13 (Williams) dal GP Australia, Round 1.
     const disqualifiedAustralia=currentRound===1 && name.toUpperCase()==='TICXY13';
     const points=disqualifiedAustralia || ['DNF','DNS','DSQ','RIT','RITIRATO'].includes(state)?0:(Number(row.punti)||0);
    const key=name.toUpperCase();if(!key)continue;
    const old=totals.get(key)||{name:info?.name||name,team,points:0};
    old.points+=points;totals.set(key,old);
   }
  }
 }
 
  // Aggiunge punti Sprint, letti dal foglio separato tramite API.
  for(const round of [2,6,7,11,14,18]){
    try{
      const response=await fetch(`${SCRIPT_URL}?action=results_sprint&round=${round}&_=${Date.now()}`,{cache:'no-store'});
      if(!response.ok)throw Error('HTTP '+response.status);
      const data=await response.json();
      if(data.success===false)throw Error(data.message||'Risposta server negativa');
      if(!Array.isArray(data.risultati))throw Error('Formato Sprint non valido');
      if(data.risultati.length)sprintCount++;
      for(const r of data.risultati){
        const raw=String(r.pilota||'').trim();if(!raw)continue;
        const name=aliases[raw.toUpperCase()]||raw;
        const info=roster.get(name.toUpperCase());
        const team=info?.team||String(r.team||'').trim();
        const pts=Number(r.punti)||0;
        const key=name.toUpperCase();const old=totals.get(key)||{name:info?.name||name,team,points:0};old.points+=pts;totals.set(key,old);
      }
    }catch(err){sprintFailed++;console.warn('Sprint round '+round+' non disponibile',err);}
  }
 if(!totals.size && cached){status.textContent='Risultati salvati · aggiornamento non disponibile';return;}
 if(!totals.size){body.innerHTML='<tr><td colspan="4" style="text-align:center;padding:25px">'+(failed?'Impossibile caricare i risultati dal server.':'Nessun risultato pubblicato.')+'</td></tr>';status.textContent=failed?'Errore collegamento Google Apps Script':'Campionato non ancora iniziato';return;}
 const rows=[...totals.values()].filter(entry=>!GRCC_EXCLUDED_DRIVERS.has(String(entry.name||'').trim().toUpperCase())).sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name,'it'));
 if(failed===0 && sprintFailed===0)grccSalvaCache(rows,count);
 grccDisegnaClassifica(rows,count,failed);
  status.textContent += ` · ${sprintCount} Sprint caricate` + (count>=2 && sprintCount===0?` · ATTENZIONE: nessun risultato Sprint ricevuto`:``) + (sprintFailed?` · ATTENZIONE: ${sprintFailed} richieste Sprint fallite`:``);
}
document.addEventListener('DOMContentLoaded',load);

</script>

<style id="grcc-back-to-top-style">
#grcc-back-to-top{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));z-index:2147483000;width:52px;height:52px;border:2px solid rgba(255,255,255,.32);border-radius:50%;background:#e10600;color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.4);font:800 27px/1 system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(12px);pointer-events:none;transition:opacity .2s ease,transform .2s ease,visibility .2s ease}
#grcc-back-to-top.grcc-visible{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
#grcc-back-to-top:hover{background:#b90500}
#grcc-back-to-top:focus-visible{outline:3px solid #00ffd1;outline-offset:3px}
@media(max-width:640px){#grcc-back-to-top{width:46px;height:46px;right:15px;bottom:calc(18px + env(safe-area-inset-bottom));font-size:25px}}
@media(prefers-reduced-motion:reduce){#grcc-back-to-top{transition:none}}
</style>
<script id="grcc-back-to-top-script">
(function(){
  function init(){
    if(document.getElementById('grcc-back-to-top'))return;
    var button=document.createElement('button');
    button.type='button';button.id='grcc-back-to-top';button.textContent='↑';
    button.setAttribute('aria-label','Torna in cima alla pagina');button.title='Torna su';
    document.body.appendChild(button);
    function update(){
      var y=Math.max(window.scrollY||0,document.documentElement.scrollTop||0,document.body.scrollTop||0);
      button.classList.toggle('grcc-visible',y>250);
    }
    button.addEventListener('click',function(){
      var smooth=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({top:0,behavior:smooth?'smooth':'auto'});
      document.documentElement.scrollTo({top:0,behavior:smooth?'smooth':'auto'});
    });
    window.addEventListener('scroll',update,{passive:true});
    window.addEventListener('resize',update,{passive:true});
    update();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

</body>
