<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlights Gare | GRCCF1ESPORTS</title>
    
    <script>
        // Controllo di sicurezza iniziale
        if (sessionStorage.getItem('grcc_authenticated') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <style>
        :root {
            --f1-red: #e10600;
            --dark-bg: #0b0f19;
            --card-bg: #131722;
            --accent-cyan: #00ffd1;
            --text-light: #ffffff;
            --text-muted: #8fa0b5;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
        }
        .container { max-width: 800px; margin: 10px auto; }
        .back-btn {
            display: inline-block;
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid var(--accent-cyan);
            padding: 8px 15px;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        h2 { color: var(--f1-red); margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--text-muted); }
        select, input, button.submit-btn {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #1a1f2c;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        select:focus, input:focus { border-color: var(--accent-cyan); outline: none; }
        button.submit-btn {
            background: var(--f1-red);
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        button.submit-btn:hover { background: #b80500; }
        .video-list { margin-top: 25px; }
        .video-item {
            background: #1a1f2c;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid var(--f1-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .video-link { color: var(--accent-cyan); text-decoration: none; font-weight: bold; }
        .video-link:hover { text-decoration: underline; }
    
        .video-upload-box{margin-top:12px;padding:15px;border:1px dashed #38506d;border-radius:8px;background:#0b0f19}
        .video-or{text-align:center;color:var(--text-muted);font-weight:bold;margin:12px 0}
        .file-status{margin-top:8px;color:var(--accent-cyan);font-size:.85rem}
        .upload-progress{display:none;margin-top:10px;color:#ffb700;font-weight:bold}
        input[readonly]{opacity:.8;cursor:not-allowed}

        /* COMMENTI HIGHLIGHTS */
        .video-item { display:block; }
        .video-main { display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .comments-box { margin-top:12px; padding-top:12px; border-top:1px solid #30384a; }
        .comments-title { font-size:.82rem; font-weight:800; color:#fff; margin-bottom:8px; }
        .comments-list { display:flex; flex-direction:column; gap:7px; margin-bottom:9px; }
        .comment-item { background:#111723; border:1px solid #263246; border-radius:7px; padding:8px 10px; }
        .comment-author { color:var(--accent-cyan); font-size:.78rem; font-weight:800; }
        .comment-text { color:#fff; font-size:.84rem; margin-top:3px; line-height:1.35; word-break:break-word; }
        .comment-form { display:flex; gap:7px; align-items:center; }
        .comment-input { flex:1; min-width:0; padding:9px 10px; background:#0b0f19; border:1px solid #34445c; color:#fff; border-radius:6px; box-sizing:border-box; }
        .comment-send { width:auto; padding:9px 11px; border:none; border-radius:6px; background:var(--accent-cyan); color:#05110f; font-weight:900; cursor:pointer; }
        .comment-empty { color:var(--text-muted); font-size:.78rem; font-style:italic; }
        @media(max-width:520px){ .video-main{align-items:flex-start;flex-direction:column;} .comment-form{align-items:stretch;} .comment-send{white-space:nowrap;} }

</style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn">← Torna al Race Control</a>

        <div class="card">
            <h2>🎬 Condividi i tuoi Highlights</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Incolla il link del tuo video oppure carica direttamente una clip dal telefono per mostrarla alla community.</p>
            
            <form id="highlightForm" onsubmit="salvaVideo(event)">
                <label for="selectRound">Seleziona il GP / Round:</label>
                <select id="selectRound" onchange="mostraVideoCaricati()" required>
                    <option value="R1">Round 1 - Australia</option>
                    <option value="R2">Round 2 - Cina</option>
                    <option value="R3">Round 3 - Giappone</option>
                    <option value="R4">Round 4 - Bahrain</option>
                    <option value="R5">Round 5 - Arabia Saudita</option>
                    <option value="R6">Round 6 - Miami</option>
                    <option value="R7">Round 7 - Canada</option>
                    <option value="R8">Round 8 - Monaco</option>
                    <option value="R9">Round 9 - Barcellona</option>
                    <option value="R10">Round 10 - Austria</option>
                    <option value="R11">Round 11 - Gran Bretagna</option>
                    <option value="R12">Round 12 - Belgio</option>
                    <option value="R13">Round 13 - Ungheria</option>
                    <option value="R14">Round 14 - Olanda</option>
                    <option value="R15">Round 15 - Italia</option>
                    <option value="R16">Round 16 - Spagna</option>
                    <option value="R17">Round 17 - Azerbaijan</option>
                    <option value="R18">Round 18 - Singapore</option>
                    <option value="R19">Round 19 - Stati Uniti</option>
                    <option value="R20">Round 20 - Messico</option>
                    <option value="R21">Round 21 - San Paolo</option>
                    <option value="R22">Round 22 - Las Vegas</option>
                    <option value="R23">Round 23 - Qatar</option>
                    <option value="R24">Round 24 - Abu Dhabi</option>
                </select>

                <label for="pilotName">Il tuo Nome / Gamertag:</label>
                <input type="text" id="pilotName" placeholder="Es. Nome Pilota" required>

                <label for="videoUrl">Link del Video / Clip:</label>
                <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">

                <div class="video-or">— OPPURE —</div>

                <div class="video-upload-box">
                    <label for="videoFile" style="margin-top:0;">📱 Carica video dal telefono / dispositivo:</label>
                    <input type="file" id="videoFile" accept="video/*" onchange="aggiornaVideoSelezionato()">
                    <div id="fileStatus" class="file-status">Nessun video selezionato.</div>
                    <div id="uploadProgress" class="upload-progress">⏳ Caricamento in corso... non chiudere la pagina.</div>
                </div>

                <button type="submit" class="submit-btn" id="submitHighlight">Pubblica Highlight 🚀</button>
            </form>
        </div>

        <div class="card">
            <h3 style="margin-top:0;">📺 Video pubblicati per questo Round</h3>
            <div id="listaVideo" class="video-list">
                </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz30o3f7QkmijHWpQgwInJMIcIujmO_F070OwXhqbKnQidHdJC4iLa-rQZy0WzsN9buuA/exec';

        window.onload = function() {
            const pilot = sessionStorage.getItem('grcc_pilot') || '';
            const pilotInput = document.getElementById('pilotName');
            if (pilot) {
                pilotInput.value = pilot;
                pilotInput.readOnly = true;
            }
            mostraVideoCaricati();
        };

        function aggiornaVideoSelezionato() {
            const file = document.getElementById('videoFile').files[0];
            document.getElementById('fileStatus').textContent = file
                ? `🎬 ${file.name} · ${(file.size/1024/1024).toFixed(1)} MB`
                : 'Nessun video selezionato.';
        }

        function leggiFileBase64(file) {
            return new Promise((resolve,reject)=>{
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result).split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function salvaVideo(event) {
            event.preventDefault();

            const round = document.getElementById('selectRound').value;
            const nome = document.getElementById('pilotName').value.trim();
            const link = document.getElementById('videoUrl').value.trim();
            const file = document.getElementById('videoFile').files[0];

            if (!link && !file) {
                alert('Inserisci un link oppure scegli un video dal telefono.');
                return;
            }

            const MAX_MB = 10;
            if (file && file.size > MAX_MB * 1024 * 1024) {
                alert(`La clip supera ${MAX_MB} MB. Per video più grandi usa un link Drive/YouTube/Twitch.`);
                return;
            }

            const btn = document.getElementById('submitHighlight');
            const progress = document.getElementById('uploadProgress');
            btn.disabled = true;
            btn.textContent = 'PUBBLICAZIONE...';
            progress.style.display = 'block';

            try {
                const payload = {
                    action: 'highlight_submit',
                    round,
                    pilota: nome,
                    videoUrl: link,
                    fileName: file ? file.name : '',
                    mimeType: file ? (file.type || 'video/mp4') : '',
                    base64: file ? await leggiFileBase64(file) : ''
                };

                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type':'text/plain;charset=utf-8'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message || 'Pubblicazione non riuscita');

                document.getElementById('videoUrl').value = '';
                document.getElementById('videoFile').value = '';
                aggiornaVideoSelezionato();

                alert('✅ Highlight pubblicato con successo!');
                await mostraVideoCaricati();

            } catch(err) {
                alert('❌ ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Pubblica Highlight 🚀';
                progress.style.display = 'none';
            }
        }

        async function mostraVideoCaricati() {
            const round = document.getElementById('selectRound').value;
            const contenitore = document.getElementById('listaVideo');
            contenitore.innerHTML = '<p style="color:var(--text-muted);">Caricamento...</p>';

            try {
                const res = await fetch(`${SCRIPT_URL}?action=highlights_list&round=${encodeURIComponent(round)}&_=${Date.now()}`, {cache:'no-store'});
                const data = await res.json();
                if (!data.success) throw new Error(data.message || 'Errore lettura highlights');

                const videoSalvati = Array.isArray(data.highlights) ? data.highlights : [];
                if (!videoSalvati.length) {
                    contenitore.innerHTML = '<p style="color: var(--text-muted); font-style: italic;">Nessun highlight caricato per questo round.</p>';
                    return;
                }

                contenitore.innerHTML = videoSalvati.map((video, index) => {
                    const highlightId = String(video.id || video.link || `${round}-${index}`);
                    const safeId = `hl-${index}`;
                    return `
                    <div class="video-item" data-highlight-id="${escapeAttr(highlightId)}">
                        <div class="video-main">
                            <div>
                                <strong style="color:#fff;">${escapeHtml(video.pilota)}</strong>
                            </div>
                            <a href="${escapeAttr(video.link)}" target="_blank" rel="noopener" class="video-link">Guarda Video 🎥</a>
                        </div>

                        <div class="comments-box">
                            <div class="comments-title">💬 Commenti</div>
                            <div id="comments-${safeId}" class="comments-list">
                                <div class="comment-empty">Caricamento commenti...</div>
                            </div>
                            <div class="comment-form">
                                <input id="comment-input-${safeId}" class="comment-input" type="text" maxlength="300" placeholder="Scrivi un commento...">
                                <button class="comment-send" type="button" onclick='pubblicaCommento(${JSON.stringify(highlightId)}, ${JSON.stringify(safeId)})'>Invia</button>
                            </div>
                        </div>
                    </div>`;
                }).join('');

                await Promise.all(videoSalvati.map((video, index) => {
                    const highlightId = String(video.id || video.link || `${round}-${index}`);
                    return caricaCommenti(highlightId, `hl-${index}`);
                }));

            } catch(err) {
                contenitore.innerHTML = `<p style="color:#ff6b6b;">❌ ${escapeHtml(err.message)}</p>`;
            }
        }

        async function caricaCommenti(highlightId, safeId) {
            const round = document.getElementById('selectRound').value;
            const box = document.getElementById(`comments-${safeId}`);
            if (!box) return;

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type':'text/plain;charset=utf-8'},
                    body: JSON.stringify({
                        action: 'highlight_comment_list',
                        round,
                        highlightId
                    })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message || 'Errore lettura commenti');

                const commenti = Array.isArray(data.commenti) ? data.commenti : [];
                if (!commenti.length) {
                    box.innerHTML = '<div class="comment-empty">Nessun commento. Scrivi il primo 👇</div>';
                    return;
                }

                box.innerHTML = commenti.map(c => `
                    <div class="comment-item">
                        <div class="comment-author">${escapeHtml(c.pilota)}</div>
                        <div class="comment-text">${escapeHtml(c.commento)}</div>
                    </div>
                `).join('');
            } catch (err) {
                box.innerHTML = `<div class="comment-empty" style="color:#ff6b6b;">❌ ${escapeHtml(err.message)}</div>`;
            }
        }

        async function pubblicaCommento(highlightId, safeId) {
            const round = document.getElementById('selectRound').value;
            const pilota = sessionStorage.getItem('grcc_pilot') || '';
            const input = document.getElementById(`comment-input-${safeId}`);
            const commento = input ? input.value.trim() : '';

            if (!pilota) {
                alert('Sessione pilota non trovata. Rientra dalla Race Control.');
                return;
            }
            if (!commento) {
                alert('Scrivi prima un commento.');
                return;
            }

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {'Content-Type':'text/plain;charset=utf-8'},
                    body: JSON.stringify({
                        action: 'highlight_comment_submit',
                        round,
                        highlightId,
                        pilota,
                        commento
                    })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message || 'Pubblicazione commento non riuscita');

                input.value = '';
                await caricaCommenti(highlightId, safeId);
            } catch (err) {
                alert('❌ ' + err.message);
            }
        }

        function escapeHtml(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
            })[c]);
        }

        function escapeAttr(v) {
            return escapeHtml(v);
        }
    </script>
</body>
</html>
